# 交叉编译配置（DESIGN §3.3.2）。
# 产物在 Debian 开发机上一次构建产出（Linux 与 Windows 两个平台），无需 Windows 环境。
# 开发机既可能是 amd64，也可能是 arm64（如 Debian 13 on ARM）：两种情况都要能构建
# x86_64 产物，因此这里显式指定各目标的链接器，避免 cargo 回退到宿主默认 cc。

# x86_64 Linux 产物：在 amd64 主机上它就是本机编译器（Debian 同样提供该三段式名字），
# 在 arm64 主机上来自交叉工具链（Debian 包 crossbuild-essential-amd64 /
# gcc-x86-64-linux-gnu）。不指定的话，arm64 主机会用 aarch64 的 cc 去链接 x86_64 目标，
# 直接报链接错误。
#
# 该名字同时也是 `cc` crate 对 x86_64-unknown-linux-gnu 目标的默认猜测（ring 等
# 带 C 代码的依赖用它编译 C 部分），因此安装同一个工具链即可，无需额外设置 CC_* 变量。
[target.x86_64-unknown-linux-gnu]
linker = "x86_64-linux-gnu-gcc"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
# 静态链接 winpthread，产物在 Windows 上无需额外 DLL。
rustflags = ["-C", "link-args=-static", "-C", "link-args=-lpthread"]
