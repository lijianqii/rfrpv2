# rfrp 客户端配置示例（DESIGN §9.2）
# 部署时请修改 server_addr、token、证书等。

[client]
server_addr = "127.0.0.1"
server_port = 7000
token = "shared-secret"
tls_enable = false
tls_server_name = "your.server.com"
work_conn_tls = false              # 工作连接是否走 TLS，默认 true
run_id_file = ""                  # run_id 持久化路径，空表示默认 ~/.rfrp/run_id

[[proxy]]
name = "ssh"
type = "tcp"
local_ip = "127.0.0.1"            # 本地回连地址，默认 127.0.0.1
local_port = 22
remote_port = 6000
pool_size = 1                     # 工作连接池大小，默认 1；0 表示禁用预热、纯按需建立

[[proxy]]
name = "web"
type = "http"
local_ip = "127.0.0.1"
local_port = 8080
custom_domains = ["dev.example.com"]
# M1 会拒绝此 http 代理（见文件头说明），M4 才支持；
# 若想 M1 跑通，可改为 type="tcp" 并指向一个本地在跑的服务。

[log]                            # 整段可选，默认 level=info、output=stderr、format=text
level = "info"
output = "stderr"
format = "text"
