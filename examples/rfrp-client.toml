# rfrp 客户端配置示例（DESIGN §9.2）
# 部署时请修改 server_addr、token、证书等。

[client]
server_addr = "127.0.0.1"
server_port = 7000
token = "shared-secret"
tls_enable = true
tls_server_name = "localhost"      # 与 examples/cert.pem 的 SAN 匹配
tls_ca = "./ca.pem"               # 自签证书场景指定 CA/服务端证书（相对配置文件目录解析，已随示例提供）
work_conn_tls = true              # 工作连接是否走 TLS，默认 true
tcp_keepalive_secs = 30           # TCP keepalive 空闲秒数；0 = 禁用（默认 30）
run_id_file = ""                  # run_id 持久化路径，空表示默认 ~/.rfrp/run_id
# status_addr = "127.0.0.1:7400"  # 可选状态端点：/、/api/status、/metrics（仅只读、无鉴权，建议绑回环）

[[proxy]]
name = "ssh"
type = "tcp"
local_ip = "127.0.0.1"            # 本地回连地址，默认 127.0.0.1
local_port = 22
remote_port = 6000
pool_size = 0                     # 工作连接池大小，默认 1；池中死连接会被自动跳过，SSH 也可用 1

# M4 支持 HTTP/HTTPS 后，可取消注释使用 vhost 代理：
# [[proxy]]
# name = "web"
# type = "http"
# local_ip = "127.0.0.1"
# local_port = 8080
# custom_domains = ["dev.example.com"]

[log]                            # 整段可选，默认 level=info、output=stderr、format=text
level = "info"
output = "stderr"
format = "text"
