# rfrp 服务端配置示例（DESIGN §9.1）
# 部署时请修改 token、证书路径、allow_ports 等。

[server]
bind_addr = "0.0.0.0"           # 控制监听地址，默认 0.0.0.0
bind_port = 7000                # 控制端口，默认 7000
token = "shared-secret"          # 鉴权 token
tls_enable = true                 # 控制链路 TLS 总开关（代码默认 false，示例显式开启）
tls_cert = "./cert.pem"          # 控制链路证书（相对配置文件目录解析，已随示例提供）
tls_key  = "./key.pem"
work_conn_tls = true             # 是否要求工作连接走 TLS（true 时拒绝明文工作连接）
tcp_keepalive_secs = 30          # TCP keepalive 空闲秒数；0 = 禁用（默认 30）
heartbeat_interval_secs = 30     # 心跳发送间隔（秒，默认 30）
heartbeat_timeout_secs = 10      # 心跳回应超时（秒，默认 10，必须小于 interval）
udp_session_timeout_secs = 300   # UDP 会话空闲超时（秒，默认 300；RDP-UDP 建议 300-600）
grace_secs = 30                  # 优雅退出宽限期（秒，默认 30；停止接收后等待在途连接结束）

# 资源上限（防认证客户端/异常流量耗尽 fd/内存）。
max_active_connections = 65536   # 并发用户连接；低内存机器建议 2048-4096
max_total_proxies = 8192         # 全局代理总数
max_total_domains = 16384        # 全局 vhost 域名总数
max_total_pooled_work_conns = 8192 # 全局预热工作连接总数

# TLS 分层说明（避免混淆）：
#   1) 控制链路 TLS：tls_enable + tls_cert/tls_key，加密 rfrps<->rfrpc 控制连接
#   2) 工作连接 TLS：work_conn_tls，加密 rfrps<->rfrpc 数据面工作连接（复用 tls_cert/tls_key 证书）
#   3) HTTPS vhost TLS：vhost_tls_cert/vhost_tls_key，终止 rfrps<->外部用户的 HTTPS（与 1/2 独立）

[dashboard]                      # 整段可选，省略则不启用 Dashboard
addr = "0.0.0.0:7500"           # 独立 HTTP 服务，不走控制协议，与 bind_port 无关
user = "admin"
password = "changeme"            # 最小长度 6（见 §9.4 校验），生产环境务必更换强密码
session_ttl_secs = 28800         # 会话 Cookie 有效期（默认 8 小时；范围 60~2592000）
cookie_secure = false            # 置于 HTTPS 反向代理之后时置 true（明文 HTTP 下不能开）

[proxy]
# 允许客户端使用的公网端口范围
allow_ports = "6000-6100,7001-7010"
# vhost 监听（http/https 各自可选，省略即 None 不监听该类型，无隐式默认 80/443）
# 注意：80/443 为特权端口（<1024），Linux 下需 root 运行或通过 setcap 授权：
#   sudo setcap 'cap_net_bind_service=+ep' /path/to/rfrp
# 非特权场景可改用 8080/8443 等高位端口
vhost_http_port  = 8080           # 默认 80 需要 root/特权；非特权环境请用 >=1024 的端口
vhost_https_port = 8443           # 同上（默认 443 需要特权）
# HTTPS vhost 证书（可与控制链路证书不同）
vhost_tls_cert = "./vhost-cert.pem"   # 相对配置文件目录解析
vhost_tls_key  = "./vhost-key.pem"

[log]                            # 整段可选，默认 level=info、output=stderr、format=text
level = "info"                   # trace|debug|info|warn|error
output = "stderr"                # stderr 或 file:/path/to.log
format = "text"                  # text|json
